<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Closet — Ropa en venta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F7F5F0;
    --card: #FFFFFF;
    --ink: #262321;
    --ink-soft: #6b6560;
    --line: #E3DED4;
    --green: #2F6B4F;
    --green-bg: #E7F0EA;
    --rust: #B4482C;
    --rust-bg: #F5E7E1;
    --tag-string: #7A5C3E;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header{
    padding: 48px 24px 28px;
    text-align:center;
    border-bottom: 1px solid var(--line);
  }
  header h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: clamp(32px, 6vw, 48px);
    margin:0 0 8px;
    letter-spacing: -0.01em;
  }
  header p{
    margin:0;
    color: var(--ink-soft);
    font-size: 15px;
    max-width: 480px;
    margin-inline:auto;
  }
  main{
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }
  #grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 28px;
  }
  .card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
    display:flex;
    flex-direction:column;
  }
  .photo-wrap{
    position:relative;
    aspect-ratio: 4/5;
    background: #EFEBE2;
    overflow:hidden;
  }
  .photo-wrap img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .stamp{
    position:absolute;
    top:12px;
    left:12px;
    font-size:11px;
    font-weight:600;
    padding: 4px 10px;
    border-radius: 3px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    transform: rotate(-4deg);
  }
  .stamp.disponible{ background: var(--green-bg); color: var(--green); border:1px solid var(--green); }
  .stamp.vendido{ background: var(--rust-bg); color: var(--rust); border:1px solid var(--rust); }
  .info{
    padding: 16px 16px 18px;
    display:flex;
    flex-direction:column;
    gap:8px;
    flex:1;
  }
  .info h3{
    margin:0;
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size: 18px;
  }
  .talla{
    font-size:12px;
    color: var(--ink-soft);
    margin:0;
  }
  .price{
    margin-top:auto;
    font-size: 20px;
    font-weight:600;
  }
  .ig-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-top:6px;
    padding: 10px 12px;
    border-radius: 3px;
    background: var(--tag-string);
    color: #fff;
    text-decoration:none;
    font-size: 13px;
    font-weight:600;
    transition: opacity .15s ease;
  }
  .ig-btn:hover{ opacity:.85; }
  .card.vendido .ig-btn{
    background: var(--ink-soft);
    pointer-events:none;
    opacity:.6;
  }
  footer{
    text-align:center;
    padding: 30px 20px 50px;
    color: var(--ink-soft);
    font-size:13px;
  }
  footer a{ color: var(--tag-string); }
</style>
</head>
<body>

<header>
  <h1>Mi Closet</h1>
  <p>Ropa en buen estado, precios fijos. Pregunta directo por Instagram si te interesa una prenda.</p>
</header>

<main>
  <div id="grid"></div>
</main>

<footer>
  Envíos a coordinar por Instagram · <a id="footer-ig" href="#">@tu_usuario</a>
</footer>

<script>
// ============================================================
//  EDITA SOLO ESTA PARTE PARA AGREGAR/QUITAR/CAMBIAR PRENDAS
//  - imagen: nombre del archivo dentro de la carpeta "fotos/"
//  - disponible: true (se puede comprar) o false (ya se vendió)
// ============================================================
const INSTAGRAM_USUARIO = "tu_usuario"; // <-- pon aquí tu usuario de Instagram (sin @)

const productos = [
  {
    nombre: "Chamarra de mezclilla",
    talla: "Talla M",
    precio: 350,
    disponible: true,
    imagen: "chamarra.jpg"
  },
  {
    nombre: "Playera oversize",
    talla: "Talla L",
    precio: 180,
    disponible: true,
    imagen: "playera.jpg"
  },
  {
    nombre: "Pants deportivo",
    talla: "Talla M",
    precio: 220,
    disponible: true,
    imagen: "pants.jpg"
  },
    {
    nombre: "Chamarra de mezclilla",
    talla: "Talla M",
    precio: 350,
    disponible: true,
    imagen: "chamarra.jpg"
  }
];
// ============================================================
//  NO NECESITAS TOCAR NADA DE AQUÍ HACIA ABAJO
// ============================================================

const grid = document.getElementById("grid");
const igLink = `https://ig.me/m/${INSTAGRAM_USUARIO}`;
document.getElementById("footer-ig").href = `https://instagram.com/${INSTAGRAM_USUARIO}`;
document.getElementById("footer-ig").textContent = `@${INSTAGRAM_USUARIO}`;

productos.forEach(p => {
  const card = document.createElement("div");
  card.className = "card " + (p.disponible ? "disponible" : "vendido");

  card.innerHTML = `
    <div class="photo-wrap">
      <img src="${p.imagen}" alt="${p.nombre}" onerror="this.style.display='none'">
      <span class="stamp ${p.disponible ? 'disponible' : 'vendido'}">
        ${p.disponible ? "Disponible" : "Vendido"}
      </span>
    </div>
    <div class="info">
      <h3>${p.nombre}</h3>
      <p class="talla">${p.talla || ""}</p>
      <p class="price">$${p.precio.toLocaleString('es-MX')} MXN</p>
      <a class="ig-btn" href="${igLink}" target="_blank" rel="noopener">
        ${p.disponible ? "Preguntar en Instagram" : "Ya no disponible"}
      </a>
    </div>
  `;
  grid.appendChild(card);
});
</script>

</body>
</html>
